services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: comptroller
      POSTGRES_USER: comptroller
      POSTGRES_DB: comptroller
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comptroller"]
      interval: 1s
      timeout: 3s
      retries: 30